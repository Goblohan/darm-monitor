[package]
name = "darm-agentsandbox-shim"
version = "0.1.0"
edition = "2021"
authors = ["DARM Contributors"]
description = "Runtime enforcement shim for the DARM AgentSandbox profile"
license = "MIT OR Apache-2.0"

[lib]
name = "darm_shim"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
