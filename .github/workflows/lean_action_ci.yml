name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# docgen was removed 2026-08-02 (it was ~98% of build time and unpublished -
# Pages was never enabled). pages/id-token permissions are dropped with it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Tier 1: placeholder search. Excludes comment lines so header text
      # like "no `sorry`" does not self-trigger. Matches the tactic forms
      # `sorry` and `admit`, not the substring inside other identifiers.
      - name: Placeholder search (tier 1)
        run: |
          if grep -rnE '^\s*(sorry|admit)\b' DarmMonitor/*.lean; then
            echo "::error::literal sorry/admit found outside comments"
            exit 1
          fi
          echo "No literal sorry/admit in source."

      - uses: leanprover/lean-action@v1

      # Tier 2: axiom audit. This is the guard that actually matters - it
      # catches sorryAx arriving through an import, which tier 1 cannot see.
      # Re-runs the build (fast: everything is cached from lean-action above)
      # and inspects the trace output directly, so this checks what was
      # actually built rather than re-deriving it separately.
      - name: Axiom audit (tier 2)
        run: |
          lake build 2>&1 | tee /tmp/build.log
          if grep -q 'sorryAx' /tmp/build.log; then
            echo "::error::sorryAx present in an axiom trace"
            grep 'sorryAx' -B1 /tmp/build.log
            exit 1
          fi
          echo "No sorryAx in any axiom trace."

      # Guards against the failure this project actually had twice: a green
      # build that quietly stopped checking something. Not a correctness
      # proof - a floor. If the trace count drops, a module fell out of the
      # root import graph or a theorem lost its #print axioms line, and
      # either is worth a human looking rather than silently passing.
      - name: Trace count floor
        run: |
          count=$(grep -c 'depends on axioms\|does not depend on any axioms' /tmp/build.log || true)
          echo "Axiom traces this run: $count"
          if [ "$count" -lt 145 ]; then
            echo "::error::only $count axiom traces found, expected at least 145"
            echo "::error::a module may have left the root import graph, or a #print axioms line was removed"
            exit 1
          fi

      # Tier 4: the runtime. The C widening multiply is NOT verified - it is
      # differentially tested against the proved Lean implementation. Those
      # tests are worth nothing if they only run when someone remembers to run
      # them, so they run here. A toolchain change that alters the arithmetic
      # (a different Clang, different flags, a target where >> is not
      # arithmetic shift) shows up as a divergence rather than silently.
      #
      # Lake does not build the C; it is compiled here the same way it is
      # locally, which also checks those instructions still work.
      - name: Build the native library
        run: |
          LEANBIN="$(dirname "$(which lean)")"
          "$LEANBIN/leanc" -c c/darm_native.c -o c/darm_native.o -O2
          ar rcs c/libdarm_native.a c/darm_native.o
          ls -l c/

      - name: Runtime differential tests (tier 4)
        run: |
          lake exe darmdemo | tee /tmp/demo.log
          if grep -q 'DIVERGENCE' /tmp/demo.log; then
            echo "::error::native C diverges from the verified Lean implementation"
            exit 1
          fi
          if ! grep -q 'RESULT: native matches' /tmp/demo.log; then
            echo "::error::demo did not report a differential result at all"
            exit 1
          fi
          echo "Native implementation agrees with the verified one on all tested pairs."
