name: DARM C-ABI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  abi-qemu-gate:
    name: Host C-ABI & QEMU Headless Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain and QEMU Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc qemu-system-arm

      - name: Build and Run C-ABI Boundary Tests
        run: |
          gcc -Iinclude tests/test_darm_shim.c -o tests/test_darm_shim
          ./tests/test_darm_shim | grep -qF "[DARM C-ABI] All unboxed scalar boundary checks passed."
