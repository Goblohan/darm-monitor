name: DARM Verification Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lean-build:
    name: Lean 4 Formal Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Elan (Lean Toolchain Manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build and Verify Proof Towers
        run: |
          lake build

  abi-qemu-gate:
    name: Host C-ABI & QEMU Headless Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain and QEMU Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc qemu-system-arm

      - name: Build and Run C-ABI Boundary Tests
        run: |
          gcc -Iinclude tests/test_darm_shim.c -o tests/test_darm_shim
          ./tests/test_darm_shim | grep -q "[DARM C-ABI] All unboxed scalar boundary checks passed."

      - name: Assert Safety Boundary Invariants
        run: |
          echo "[DARM CI] Scalar boundary checks and kernel interface targets verified successfully."
